<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3556e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IBG Notes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>IBG Studios Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: quiet two-pane notepad, list on the left, writing surface on the right; cool slate neutrals with one electric-blue accent. */
:root{
  --bg:#f3f6fb;--panel:#ffffff;--sunk:#eaeff7;--ink:#0d1526;--mute:#66728b;--line:#e0e6f0;
  --accent:#3556e8;--accent-ink:#ffffff;--accent-soft:#e6ecff;--danger:#d8434f;
  --display:"Sora","Manrope",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080c15;--panel:#0e1422;--sunk:#141b2d;--ink:#e7ecf7;--mute:#8591ab;--line:#1b2540;
    --accent:#7f97ff;--accent-ink:#0a1030;--accent-soft:#18224a;--danger:#ff6b76;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080c15;--panel:#0e1422;--sunk:#141b2d;--ink:#e7ecf7;--mute:#8591ab;--line:#1b2540;
  --accent:#7f97ff;--accent-ink:#0a1030;--accent-soft:#18224a;--danger:#ff6b76;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;width:100%}
button:focus-visible,input:focus-visible,textarea:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block;flex:none}
[hidden]{display:none!important}

.app{height:100%;display:grid;grid-template-columns:340px 1fr}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:12px;padding:20px 20px 14px}
.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(140deg,var(--accent),#7a5cff);color:#fff;display:grid;place-items:center;font:700 12px/1 var(--display);letter-spacing:.5px;box-shadow:0 6px 16px -6px var(--accent)}
.brand b{display:block;font:600 16px/1.15 var(--display);letter-spacing:-.01em}
.brand span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:600}
.tools-top{padding:0 16px;display:flex;gap:8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:12px;padding:0 12px;height:40px;color:var(--mute)}
.search input{color:var(--ink)}
.search input::placeholder{color:var(--mute)}
.btn-new{flex:none;width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:transform .12s}
.btn-new:active{transform:scale(.94)}
.filters{display:flex;gap:6px;padding:14px 16px 10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;font-weight:600;color:var(--mute);padding:6px 12px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.chip em{font-style:normal;opacity:.7;margin-left:5px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.list{flex:1;overflow-y:auto;padding:4px 10px 24px;min-height:0}
.item{display:block;width:100%;text-align:left;padding:12px 12px;border-radius:14px;margin-bottom:2px;cursor:pointer}
.item:hover{background:var(--sunk)}
.item.on{background:var(--accent-soft)}
.item h3{margin:0;font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:6px;font-family:var(--body);font-weight:600}
.item h3 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item h3 svg{color:var(--accent)}
.item p{margin:2px 0 7px;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute);font-weight:500}
.tag{padding:2px 9px;border-radius:99px;font-weight:600;background:hsl(var(--h,220) 70% 94%);color:hsl(var(--h,220) 55% 36%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{background:hsl(var(--h,220) 40% 20%);color:hsl(var(--h,220) 80% 80%)}}
:root[data-theme="dark"] .tag{background:hsl(var(--h,220) 40% 20%);color:hsl(var(--h,220) 80% 80%)}
.row .sp{flex:1}
.foot{border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.foot span{flex:1}
.foot button{font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--ink)}
.hint{padding:40px 24px;text-align:center;color:var(--mute);font-size:14px}

.main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.empty{margin:auto;text-align:center;color:var(--mute);padding:24px}
.empty .mark{width:60px;height:60px;border-radius:18px;font-size:18px;margin:0 auto 18px;opacity:.9}
.empty h2{font:600 20px var(--display);color:var(--ink);margin:0 0 6px}
.empty p{margin:0 0 18px}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:12px;padding:10px 18px}
.ed{display:flex;flex-direction:column;min-height:0;flex:1}
.bar{display:flex;align-items:center;gap:4px;padding:14px 20px 6px}
.bar .grow{flex:1}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--mute)}
.ib:hover{background:var(--sunk);color:var(--ink)}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.ib.danger:hover{color:var(--danger)}
.back{display:none}
.status{font-size:12px;color:var(--mute);margin-right:8px;font-weight:500}
.txt{font-size:13px;font-weight:600;padding:0 12px;width:auto;gap:6px;display:flex;align-items:center}
.sheet{flex:1;min-height:0;overflow-y:auto;padding:6px 20px 60px}
.page{max-width:720px;margin:0 auto}
#title{font:700 30px/1.2 var(--display);letter-spacing:-.02em;padding:10px 0 4px}
#title::placeholder{color:var(--line)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--mute);font-size:12.5px;padding:2px 0 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.meta input{width:130px;background:var(--sunk);border-radius:99px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--ink)}
.tools{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tb{min-width:34px;height:32px;padding:0 9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mute);background:var(--sunk)}
.tb:hover{color:var(--ink)}
#body{min-height:55vh;resize:none;font-size:16px;line-height:1.7;display:block;overflow:hidden}
#body::placeholder{color:var(--mute);opacity:.7}
.view{min-height:50vh;font-size:16px;line-height:1.7;cursor:text}
.view h1{font:600 22px/1.3 var(--display);margin:18px 0 4px}
.view h2{font:600 18px/1.3 var(--display);margin:16px 0 4px}
.view p{margin:0 0 4px;min-height:1.2em}
.view .q{border-left:3px solid var(--accent);padding-left:12px;color:var(--mute);margin:4px 0}
.view .li{display:flex;gap:10px;padding-left:4px}
.view .li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:.72em;flex:none}
.view code{background:var(--sunk);border-radius:6px;padding:1px 6px;font-size:.9em}
.ck{display:flex;gap:10px;align-items:flex-start;padding:2px 0}
.box{flex:none;width:22px;height:22px;border-radius:7px;border:1.8px solid var(--mute);margin-top:4px;display:grid;place-items:center;color:var(--accent-ink)}
.ck.on .box{background:var(--accent);border-color:var(--accent)}
.ck.on span{color:var(--mute);text-decoration:line-through}
.ghost{color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:30}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.5);z-index:20;display:grid;place-items:center;padding:16px}
.modal .box2{background:var(--panel);border-radius:18px;padding:18px;width:100%;max-width:540px}
.modal textarea{height:44vh;background:var(--sunk);border-radius:12px;padding:12px;font-size:13px;margin:10px 0;font-family:ui-monospace,Menlo,monospace}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side,.main{grid-column:1;grid-row:1}
  .app[data-screen="list"] .main{display:none}
  .app[data-screen="edit"] .side{display:none}
  .back{display:grid}
  .bar{padding:10px 10px 4px}
  .sheet{padding:4px 16px 60px}
  #title{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app" data-screen="list">
  <aside class="side">
    <div class="brand"><div class="mark">IBG</div><div><b>IBG Studios</b><span>Notes</span></div></div>
    <div class="tools-top">
      <label class="search" for="q"><svg id="ic-search" width="18" height="18"></svg><input id="q" type="search" placeholder="Search notes" autocomplete="off"></label>
      <button class="btn-new" id="new" aria-label="New note" title="New note"></button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"><div class="hint">Loading your notes…</div></div>
    <div class="foot"><span>Saved on this device</span><button data-act="backup">Back up</button><button data-act="restoref">Restore</button><input type="file" id="rf" accept=".json,application/json" hidden></div>
  </aside>
  <main class="main" id="main">
    <div class="empty" id="empty">
      <div class="mark">IBG</div>
      <h2>Pick a note or start a new one</h2>
      <p>Plans, ideas and to-dos for every game, in one quiet place.</p>
      <button class="primary" id="new2">New note</button>
    </div>
    <div class="ed" id="ed" hidden>
      <div class="bar" id="bar"></div>
      <div class="sheet"><div class="page">
        <input id="title" placeholder="Title" autocomplete="off">
        <div class="meta"><input id="tag" list="taglist" placeholder="Add tag" autocomplete="off"><datalist id="taglist"></datalist><span id="info"></span></div>
        <div class="tools" id="tools">
          <button class="tb" data-ins="h" title="Heading">H</button>
          <button class="tb" data-ins="b" title="Bold">B</button>
          <button class="tb" data-ins="li" title="Bullet">•</button>
          <button class="tb" data-ins="ck" title="Checklist">☐ List</button>
          <button class="tb" data-ins="q" title="Quote">“</button>
          <button class="tb" data-ins="d" title="Insert today's date">Date</button>
        </div>
        <textarea id="body" placeholder="Start writing. Use ☐ List for a checklist."></textarea>
        <div class="view" id="view" hidden></div>
      </div></div>
    </div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<div id="modalhost"></div>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var clone=function(o){return JSON.parse(JSON.stringify(o));};
var IC={
 plus:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 pin:'<path d="M9 4h6l-1 6 3 3v2H7v-2l3-3-1-6z"/><path d="M12 15v5"/>',
 eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 back:'<path d="m15 18-6-6 6-6"/>',
 restore:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
 check:'<path d="m5 12 5 5 9-10"/>'
};
function ic(n,s,fill){s=s||20;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="'+(fill?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+IC[n]+'</svg>';}
$('#ic-search').outerHTML=ic('search',18);
$('#new').innerHTML=ic('plus',20);

var DEFAULT_TAGS=['Mithai Box','Dabba Jam','Akshar Logic','Unbuild 3D','Megh','Ideas','Studio'];
var N={},sel=null,filter='all',q='',mode='edit',arm=null,loaded=false,store=null,localOnly=false;
var dirty={},ver={},timers={},saving={},toastT=null;

/* ---------- storage ---------- */
function localStore(){
  var K='ibg-notes-v1',data={};
  try{data=JSON.parse(localStorage.getItem(K)||'{}');}catch(e){data={};}
  var write=function(){try{localStorage.setItem(K,JSON.stringify(data));}catch(e){}};
  return {start:function(f){f(clone(data));},save:function(n){data[n.id]=clone(n);write();return Promise.resolve();},del:function(id){delete data[id];write();return Promise.resolve();}};
}
function dbStore(db){
  return {
    start:function(f){
      db.collection('notes').onSnapshot(function(s){var o={};s.docs.forEach(function(d){var v=clone(d.data()||{});v.id=d.id;o[d.id]=v;});f(o);},function(){setStatus('Offline');});
    },
    save:function(n){var b=clone(n);delete b.id;return db.doc('notes/'+n.id).set(b);},
    del:function(id){return db.doc('notes/'+id).delete();}
  };
}

/* ---------- helpers ---------- */
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2400);}
function setStatus(s){var el=$('#status');if(el)el.textContent=s;}
function norm(n){n.title=n.title||'';n.body=n.body||'';n.tag=n.tag||'';n.pinned=!!n.pinned;n.trashed=!!n.trashed;n.created=n.created||n.updated||new Date().toISOString();n.updated=n.updated||n.created;return n;}
function uid(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function hue(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%60;return 200+h;}
function fmtShort(iso){
  var d=new Date(iso),now=new Date();
  if(d.toDateString()===now.toDateString())return d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
  var y=new Date(now);y.setDate(now.getDate()-1);
  if(d.toDateString()===y.toDateString())return 'Yesterday';
  return d.toLocaleDateString('en-IN',d.getFullYear()===now.getFullYear()?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'2-digit'});
}
function fmtFull(iso){return new Date(iso).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});}
function words(s){s=s.trim();return s?s.split(/\s+/).length:0;}
function plain(l){return l.replace(/^\s*(#{1,3} |- \[[ xX]\] ?|- |> )/,'').replace(/\*\*|`/g,'');}
function snippet(b){var ls=b.split('\n');for(var i=0;i<ls.length;i++){var p=plain(ls[i]).trim();if(p)return p;}return 'No additional text';}
function progress(b){var t=0,d=0;b.split('\n').forEach(function(l){var m=l.match(/^\s*- \[( |x|X)\]/);if(m){t++;if(m[1]!==' ')d++;}});return t?d+'/'+t:'';}
function current(){return sel&&N[sel]?N[sel]:null;}

/* ---------- list + filters ---------- */
function live(){return Object.keys(N).map(function(k){return N[k];}).filter(function(n){return !n.trashed;});}
function renderFilters(){
  var all=live(),tags={};
  all.forEach(function(n){if(n.tag)tags[n.tag]=(tags[n.tag]||0)+1;});
  var trashed=Object.keys(N).filter(function(k){return N[k].trashed;}).length;
  var pinned=all.filter(function(n){return n.pinned;}).length;
  var chips=[['all','All',all.length]];
  if(pinned)chips.push(['pinned','Pinned',pinned]);
  Object.keys(tags).sort().forEach(function(t){chips.push(['t:'+t,t,tags[t]]);});
  if(trashed)chips.push(['trash','Deleted',trashed]);
  if(!chips.some(function(c){return c[0]===filter;}))filter='all';
  $('#filters').innerHTML=chips.map(function(c){return '<button class="chip'+(filter===c[0]?' on':'')+'" data-f="'+esc(c[0])+'">'+esc(c[1])+'<em>'+c[2]+'</em></button>';}).join('');
  var seen={},opts=[];
  DEFAULT_TAGS.concat(Object.keys(tags)).forEach(function(t){if(!seen[t]){seen[t]=1;opts.push('<option value="'+esc(t)+'">');}});
  $('#taglist').innerHTML=opts.join('');
}
function visibleNotes(){
  var arr=Object.keys(N).map(function(k){return N[k];});
  arr=arr.filter(function(n){return filter==='trash'?n.trashed:!n.trashed;});
  if(filter==='pinned')arr=arr.filter(function(n){return n.pinned;});
  if(filter.indexOf('t:')===0)arr=arr.filter(function(n){return n.tag===filter.slice(2);});
  if(q){var s=q.toLowerCase();arr=arr.filter(function(n){return (n.title+' '+n.body+' '+n.tag).toLowerCase().indexOf(s)>-1;});}
  arr.sort(function(a,b){if(a.pinned!==b.pinned)return a.pinned?-1:1;return a.updated<b.updated?1:a.updated>b.updated?-1:0;});
  return arr;
}
function renderList(){
  var arr=visibleNotes(),el=$('#list');
  if(!loaded){return;}
  if(!arr.length){el.innerHTML='<div class="hint">'+(q?'No notes match “'+esc(q)+'”.':filter==='trash'?'Nothing deleted.':'No notes yet. Tap + to write your first one.')+'</div>';return;}
  el.innerHTML=arr.map(function(n){
    var pr=progress(n.body);
    return '<div class="item'+(n.id===sel?' on':'')+'" role="button" tabindex="0" data-id="'+n.id+'"><h3>'+(n.pinned?ic('pin',14,true):'')+'<span>'+esc(n.title.trim()||'Untitled')+'</span></h3><p>'+esc(snippet(n.body))+'</p><div class="row">'+(n.tag?'<span class="tag" style="--h:'+hue(n.tag)+'">'+esc(n.tag)+'</span>':'')+(pr?'<span>☑ '+pr+'</span>':'')+'<span class="sp"></span><span>'+esc(fmtShort(n.updated))+'</span></div></div>';
  }).join('');
}

/* ---------- editor ---------- */
function renderBar(){
  var n=current(),b=$('#bar');if(!n){b.innerHTML='';return;}
  var h='<button class="ib back" data-act="back" aria-label="Back to notes">'+ic('back')+'</button><span class="grow"></span><span class="status" id="status"></span>';
  if(n.trashed){
    h+='<button class="ib txt" data-act="restore">'+ic('restore',18)+'Restore</button><button class="ib txt danger" data-act="purge" style="color:var(--danger)">'+(arm===n.id?'Sure? Tap again':'Delete forever')+'</button>';
  }else{
    h+='<button class="ib'+(n.pinned?' on':'')+'" data-act="pin" aria-label="Pin" title="Pin">'+ic('pin',19,n.pinned)+'</button>'+
       '<button class="ib'+(mode==='view'?' on':'')+'" data-act="mode" aria-label="'+(mode==='view'?'Edit':'Preview')+'" title="'+(mode==='view'?'Edit':'Preview and tick checklists')+'">'+ic(mode==='view'?'edit':'eye',19)+'</button>'+
       '<button class="ib" data-act="copy" aria-label="Copy note" title="Copy note">'+ic('copy',19)+'</button>'+
       '<button class="ib danger" data-act="trash" aria-label="Delete" title="Delete">'+ic('trash',19)+'</button>';
  }
  b.innerHTML=h;
}
function updateInfo(){var n=current();if(!n)return;$('#info').textContent='Edited '+fmtFull(n.updated)+' · '+words(n.body)+' words';}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
function renderView(b){
  if(!b.trim())return '<p class="ghost">Empty note. Tap to write.</p>';
  return b.split('\n').map(function(ln,i){
    var m;
    if((m=ln.match(/^\s*- \[( |x|X)\] ?(.*)$/)))return '<div class="ck'+(m[1]!==' '?' on':'')+'"><button class="box" data-line="'+i+'" aria-label="Toggle">'+(m[1]!==' '?ic('check',14):'')+'</button><span>'+inline(m[2])+'</span></div>';
    if((m=ln.match(/^# (.*)/)))return '<h1>'+inline(m[1])+'</h1>';
    if((m=ln.match(/^#{2,3} (.*)/)))return '<h2>'+inline(m[1])+'</h2>';
    if((m=ln.match(/^- (.*)/)))return '<div class="li"><span>'+inline(m[1])+'</span></div>';
    if((m=ln.match(/^> (.*)/)))return '<div class="q">'+inline(m[1])+'</div>';
    return '<p>'+inline(ln)+'</p>';
  }).join('');
}
function autosize(){var t=$('#body');t.style.height='auto';t.style.height=Math.max(t.scrollHeight,Math.round(window.innerHeight*0.5))+'px';}
function applyMode(){
  var n=current();if(!n)return;
  var ro=n.trashed;
  if(ro)mode='view';
  $('#body').hidden=mode==='view';$('#tools').hidden=mode==='view'||ro;
  var v=$('#view');v.hidden=mode!=='view';
  if(mode==='view')v.innerHTML=renderView(n.body);else autosize();
  $('#title').readOnly=ro;$('#tag').readOnly=ro;
  renderBar();
}
function loadEditor(){
  var n=current();
  $('#empty').hidden=!!n;$('#ed').hidden=!n;
  if(!n){return;}
  $('#title').value=n.title;$('#tag').value=n.tag;$('#body').value=n.body;
  updateInfo();applyMode();setStatus(dirty[n.id]?'Saving…':'Saved');
}
function discardIfEmpty(id){
  var n=id&&N[id];
  if(n&&!n.title.trim()&&!n.body.trim()&&!n.tag){delete N[id];clearTimeout(timers[id]);delete dirty[id];if(store)store.del(id);}
}
function select(id,focusMode){
  if(sel&&sel!==id)discardIfEmpty(sel);
  sel=id;arm=null;
  var n=N[id];
  mode=focusMode||((n&&(n.body.trim()||n.title.trim()))?'view':'edit');
  loadEditor();renderFilters();renderList();
  $('#app').dataset.screen='edit';
}
function createNote(){
  if(!store)return;
  var now=new Date().toISOString();
  var n={id:uid(),title:'',body:'',tag:filter.indexOf('t:')===0?filter.slice(2):'',pinned:false,trashed:false,created:now,updated:now};
  if(sel)discardIfEmpty(sel);
  N[n.id]=n;filter=filter==='trash'?'all':filter;
  select(n.id,'edit');
  touch(n);
  setTimeout(function(){$('#title').focus();},30);
}

/* ---------- saving ---------- */
function touch(n){
  n.updated=new Date().toISOString();dirty[n.id]=1;ver[n.id]=(ver[n.id]||0)+1;
  setStatus('Saving…');updateInfo();
  clearTimeout(timers[n.id]);timers[n.id]=setTimeout(function(){flush(n.id);},600);
  renderList();
}
function flush(id){
  var n=N[id];if(!n||!store)return;
  if(saving[id]){timers[id]=setTimeout(function(){flush(id);},300);return;}
  saving[id]=1;var v=ver[id];
  store.save(n).then(function(){saving[id]=0;if(ver[id]===v){delete dirty[id];if(sel===id)setStatus(localOnly?'Saved on this device':'Saved');}},function(){saving[id]=0;setStatus('Not saved');toast('Could not save. Check your connection.');});
}
function onData(o){
  loaded=true;
  Object.keys(N).forEach(function(id){if(!(id in o)&&!dirty[id])delete N[id];});
  Object.keys(o).forEach(function(id){
    if(dirty[id])return;
    var ch=!N[id]||N[id].updated!==o[id].updated;
    N[id]=norm(o[id]);
    if(id===sel&&ch){var a=document.activeElement;if(!(a&&(a.id==='title'||a.id==='body'||a.id==='tag')))loadEditor();}
  });
  if(sel&&!N[sel]){sel=null;loadEditor();$('#app').dataset.screen='list';}
  renderFilters();renderList();
}

/* ---------- toolbar ---------- */
function mutate(fn){var t=$('#body');t.focus();fn(t);t.dispatchEvent(new Event('input'));}
function linePrefix(prefix){mutate(function(t){
  var v=t.value,s=t.selectionStart,ls=v.lastIndexOf('\n',s-1)+1,le=v.indexOf('\n',s);if(le<0)le=v.length;
  var line=v.slice(ls,le),nl=line.indexOf(prefix)===0?line.slice(prefix.length):prefix+line.replace(/^(#{1,3} |- \[[ xX]\] |- |> )/,'');
  t.value=v.slice(0,ls)+nl+v.slice(le);var p=ls+nl.length;t.setSelectionRange(p,p);
});}
function wrap(mk){mutate(function(t){var s=t.selectionStart,e=t.selectionEnd,v=t.value;t.value=v.slice(0,s)+mk+v.slice(s,e)+mk+v.slice(e);t.setSelectionRange(s+mk.length,e+mk.length);});}
function insertText(x){mutate(function(t){var s=t.selectionStart;if(s>0&&!/\s/.test(t.value.charAt(s-1)))x=' '+x;t.value=t.value.slice(0,s)+x+t.value.slice(t.selectionEnd);t.setSelectionRange(s+x.length,s+x.length);});}
function copyText(txt){
  var fail=function(){
    $('#modalhost').innerHTML='<div class="modal" data-act="closemodal"><div class="box2" onclick="event.stopPropagation()"><b>Copy this text</b><textarea id="mtxt" readonly>'+esc(txt)+'</textarea><button class="primary" data-act="closemodal">Close</button></div></div>';
    setTimeout(function(){var t=$('#mtxt');if(t){t.focus();t.select();}},30);
  };
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Copied');},fail);return;}}catch(e){}
  fail();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  var a=t.closest('[data-act]');
  if(a){
    var act=a.dataset.act,n=current();
    if(act==='closemodal'){$('#modalhost').innerHTML='';return;}
    if(act==='backup'){backup();return;}
    if(act==='restoref'){$('#rf').click();return;}
    if(act==='back'){if(sel)discardIfEmpty(sel);if(sel&&!N[sel])sel=null;$('#app').dataset.screen='list';renderFilters();renderList();return;}
    if(!n)return;
    if(act==='pin'){n.pinned=!n.pinned;touch(n);renderBar();renderFilters();}
    else if(act==='mode'){mode=mode==='view'?'edit':'view';applyMode();if(mode==='edit')setTimeout(function(){$('#body').focus();},20);}
    else if(act==='copy'){copyText((n.title?n.title+'\n\n':'')+n.body);}
    else if(act==='trash'){n.trashed=true;n.pinned=false;touch(n);toast('Moved to Deleted');sel=null;loadEditor();$('#app').dataset.screen='list';renderFilters();renderList();}
    else if(act==='restore'){n.trashed=false;touch(n);toast('Restored');filter='all';loadEditor();renderFilters();renderList();}
    else if(act==='purge'){
      if(arm===n.id){var id=n.id;delete N[id];delete dirty[id];clearTimeout(timers[id]);if(store)store.del(id);sel=null;arm=null;loadEditor();$('#app').dataset.screen='list';renderFilters();renderList();toast('Deleted for good');}
      else{arm=n.id;renderBar();}
    }
    return;
  }
  var f=t.closest('[data-f]');
  if(f){filter=f.dataset.f;renderFilters();renderList();return;}
  var it=t.closest('.item');
  if(it){select(it.dataset.id);return;}
  var ins=t.closest('[data-ins]');
  if(ins){
    var k=ins.dataset.ins;
    if(k==='h')linePrefix('## ');else if(k==='li')linePrefix('- ');else if(k==='ck')linePrefix('- [ ] ');else if(k==='q')linePrefix('> ');
    else if(k==='b')wrap('**');else if(k==='d')insertText(new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'}));
    return;
  }
  var box=t.closest('.box');
  if(box&&box.dataset.line!==undefined){
    var nn=current();if(!nn||nn.trashed)return;
    var ls=nn.body.split('\n'),i=+box.dataset.line;
    ls[i]=/\[ \]/.test(ls[i])?ls[i].replace('[ ]','[x]'):ls[i].replace(/\[[xX]\]/,'[ ]');
    nn.body=ls.join('\n');$('#body').value=nn.body;touch(nn);$('#view').innerHTML=renderView(nn.body);return;
  }
  var v=t.closest('#view');
  if(v&&current()&&!current().trashed){mode='edit';applyMode();setTimeout(function(){$('#body').focus();},20);}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('item')){select(e.target.dataset.id);}
  if(e.key==='/'&&!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){e.preventDefault();$('#q').focus();}
  if(e.key==='Escape'&&e.target.id==='q'){e.target.value='';q='';renderList();e.target.blur();}
});
$('#new').addEventListener('click',createNote);
$('#new2').addEventListener('click',createNote);
$('#q').addEventListener('input',function(e){q=e.target.value.trim();renderList();});
$('#title').addEventListener('input',function(e){var n=current();if(!n||n.trashed)return;n.title=e.target.value;touch(n);});
$('#tag').addEventListener('input',function(e){var n=current();if(!n||n.trashed)return;n.tag=e.target.value.trim();touch(n);});
$('#tag').addEventListener('change',function(){renderFilters();});
$('#body').addEventListener('input',function(e){var n=current();if(!n||n.trashed)return;n.body=e.target.value;autosize();touch(n);});
$('#body').addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
  var t=e.target,s=t.selectionStart;if(s!==t.selectionEnd)return;
  var v=t.value,ls=v.lastIndexOf('\n',s-1)+1,m=v.slice(ls,s).match(/^(- \[[ xX]\] |- |> )(.*)$/);
  if(!m)return;
  e.preventDefault();
  if(!m[2].trim()){t.value=v.slice(0,ls)+v.slice(s);t.setSelectionRange(ls,ls);}
  else{var pre=m[1].indexOf('- [')===0?'- [ ] ':m[1],ins='\n'+pre;t.value=v.slice(0,s)+ins+v.slice(s);var p=s+ins.length;t.setSelectionRange(p,p);}
  t.dispatchEvent(new Event('input'));
});
window.addEventListener('resize',function(){if(!$('#body').hidden)autosize();});
window.addEventListener('pagehide',function(){Object.keys(dirty).forEach(function(id){flush(id);});});

/* ---------- backup and restore ---------- */
function backup(){
  var list=Object.keys(N).map(function(k){return N[k];});
  if(!list.length){toast('Nothing to back up yet');return;}
  var data=JSON.stringify({app:'ibg-notes',version:1,exported:new Date().toISOString(),notes:list},null,1);
  try{
    var url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    var a=document.createElement('a');a.href=url;
    var d=new Date();a.download='ibg-notes-backup-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},4000);
    toast('Backup saved to your Downloads');
  }catch(e){copyText(data);}
}
$('#rf').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result),arr=Array.isArray(j)?j:j.notes;
      if(!Array.isArray(arr))throw new Error('bad');
      var added=0;
      arr.forEach(function(x){
        if(!x||!x.id)return;
        x=norm(x);
        if(!N[x.id]||N[x.id].updated<x.updated){N[x.id]=x;added++;store.save(x);}
      });
      renderFilters();renderList();toast(added?('Restored '+added+' note'+(added>1?'s':'')):'Everything was already here');
    }catch(err){toast('That file is not an IBG Notes backup');}
    e.target.value='';
  };
  r.readAsText(f);
});

/* ---------- start ---------- */
function begin(s){store=s;s.start(onData);}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
var cl=window.claude;
if(cl&&cl.use){
  cl.use('db').then(function(d){
    if(d){begin(dbStore(d));}
    else{localOnly=true;begin(localStore());}
  },function(){localOnly=true;begin(localStore());});
}else{localOnly=true;begin(localStore());}
})();
</script>
