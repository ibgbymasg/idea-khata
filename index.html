<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" id="tc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IBG Notes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>IBG Studios Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a fixed app frame (no page scroll, no zoom; only the list and the note text scroll); cool slate neutrals, one electric-blue accent, seven label colours. */
:root{
  --bg:#f3f6fb;--panel:#ffffff;--sunk:#eef2f8;--ink:#0d1526;--mute:#66728b;--line:#e3e8f1;
  --accent:#3556e8;--accent-ink:#ffffff;--accent-soft:#e8edff;--danger:#d8434f;
  --c-r:#e5484d;--c-o:#f0892b;--c-y:#e2b007;--c-g:#2fa66a;--c-b:#3d63dd;--c-v:#8e5bd9;--c-k:#7a869f;
  --display:"Sora","Manrope",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080c15;--panel:#0e1422;--sunk:#161d30;--ink:#e7ecf7;--mute:#8591ab;--line:#1c2642;
    --accent:#7f97ff;--accent-ink:#0a1030;--accent-soft:#1a2550;--danger:#ff6b76;
    --c-r:#ff6369;--c-o:#ff9d4d;--c-y:#f5c93a;--c-g:#4cc38a;--c-b:#6f8cff;--c-v:#b18cff;--c-k:#9aa6bf;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080c15;--panel:#0e1422;--sunk:#161d30;--ink:#e7ecf7;--mute:#8591ab;--line:#1c2642;
  --accent:#7f97ff;--accent-ink:#0a1030;--accent-soft:#1a2550;--danger:#ff6b76;
  --c-r:#ff6369;--c-o:#ff9d4d;--c-y:#f5c93a;--c-g:#4cc38a;--c-b:#6f8cff;--c-v:#b18cff;--c-k:#9aa6bf;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,.view{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:none;border:0;outline:0;width:100%;border-radius:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block;flex:none}
[hidden]{display:none!important}

.app{height:100%;display:grid;grid-template-columns:340px 1fr}
/* ---- sidebar / list screen ---- */
.side{position:relative;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:12px;padding:calc(16px + var(--sat)) 14px 12px 20px;flex:none}
.brand .who{flex:1;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,var(--accent),#7a5cff);color:#fff;display:grid;place-items:center;font:700 12px/1 var(--display);letter-spacing:.5px;box-shadow:0 6px 16px -6px var(--accent);flex:none}
.brand b{display:block;font:600 17px/1.15 var(--display);letter-spacing:-.01em}
.brand span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:700}
.tools-top{padding:0 16px;display:flex;gap:8px;flex:none}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:13px;padding:0 12px;height:42px;color:var(--mute)}
.search input{color:var(--ink);font-size:15px}
.search input::placeholder{color:var(--mute)}
.btn-new{flex:none;height:42px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:6px;padding:0 16px 0 12px;font-weight:700;font-size:14px;box-shadow:0 8px 18px -10px var(--accent);transition:transform .12s}
.btn-new:active{transform:scale(.96)}
.filters{display:flex;gap:6px;padding:12px 16px 8px;overflow-x:auto;scrollbar-width:none;flex:none;touch-action:pan-x}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;font-weight:700;color:var(--mute);padding:6px 12px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.chip em{font-style:normal;opacity:.7;margin-left:5px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.chip.warn{color:var(--c-o);border-color:color-mix(in srgb,var(--c-o) 40%,transparent)}
.chip.warn.on{background:var(--c-o);border-color:var(--c-o);color:#fff}
.cbar{display:flex;align-items:center;gap:10px;padding:2px 18px 10px;flex:none}
.cap{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-right:2px}
.cdot,.dot{flex:none;width:22px;height:22px;border-radius:50%;background:var(--lc);position:relative;transition:transform .12s}
.cdot:active,.dot:active{transform:scale(.86)}
.cdot.on,.dot.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--lc)}
.cdot.off{opacity:.3}
.listhead{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 6px;font-size:12px;color:var(--mute);font-weight:700;flex:none}
.listhead select{width:auto;background:var(--sunk);border-radius:8px;padding:4px 8px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px 10px 24px;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.item{display:block;position:relative;width:100%;text-align:left;padding:13px 14px 13px 22px;border-radius:16px;margin-bottom:3px;cursor:pointer;transition:background .15s}
.item:hover{background:var(--sunk)}
.item:active{background:var(--sunk)}
.item.on{background:var(--accent-soft)}
.item[data-c]::before{content:"";position:absolute;left:9px;top:14px;bottom:14px;width:4px;border-radius:4px;background:var(--lc)}
.item h3{margin:0;font-size:15px;display:flex;align-items:center;gap:6px;font-family:var(--body);font-weight:700}
.item h3 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item h3 svg{color:var(--accent)}
.item p{margin:2px 0 8px;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute);font-weight:600;flex-wrap:wrap}
.tag{padding:2px 9px;border-radius:99px;font-weight:700;background:hsl(var(--h,220) 70% 94%);color:hsl(var(--h,220) 55% 36%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{background:hsl(var(--h,220) 40% 20%);color:hsl(var(--h,220) 80% 80%)}}
:root[data-theme="dark"] .tag{background:hsl(var(--h,220) 40% 20%);color:hsl(var(--h,220) 80% 80%)}
.prog{display:inline-flex;align-items:center;gap:6px}
.mini{width:34px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent);border-radius:4px}
.due{font-weight:700}
.due.over{color:var(--c-r)}
.due.today{color:var(--c-o)}
.row .sp{flex:1}
.hint{padding:48px 24px;text-align:center;color:var(--mute);font-size:14px}
.fab{display:none;position:absolute;right:18px;bottom:calc(20px + var(--sab));z-index:6;height:56px;padding:0 22px 0 18px;border-radius:19px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15.5px;gap:8px;align-items:center;box-shadow:0 14px 28px -10px var(--accent),0 3px 8px rgba(10,20,50,.18);transition:transform .14s}
.fab:active{transform:scale(.95)}

/* ---- editor ---- */
.main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.empty{margin:auto;text-align:center;color:var(--mute);padding:24px}
.empty .logo{width:64px;height:64px;border-radius:20px;font-size:18px;margin:0 auto 18px}
.empty h2{font:600 20px var(--display);color:var(--ink);margin:0 0 6px}
.empty p{margin:0 0 18px}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:13px;padding:11px 20px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.ed{display:flex;flex-direction:column;height:100%;min-height:0}
.bar{display:flex;align-items:center;gap:2px;padding:calc(10px + var(--sat)) 14px 2px;flex:none}
.bar .grow{flex:1}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mute)}
.ib:hover{background:var(--sunk);color:var(--ink)}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.ib.danger:hover{color:var(--danger)}
.back{display:none;align-items:center;gap:2px;font-weight:700;color:var(--accent);padding:0 10px 0 2px;height:40px;font-size:15px}
.txt{font-size:13px;font-weight:700;padding:0 12px;width:auto;gap:6px;display:flex;align-items:center}
.page{flex:1;min-height:0;width:100%;max-width:740px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column}
#title{flex:none;font:700 28px/1.2 var(--display);letter-spacing:-.02em;padding:8px 0 4px}
#title::placeholder{color:var(--mute);opacity:.45}
.meta{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:2px 0 8px;color:var(--mute);font-size:12.5px}
.meta input{background:var(--sunk);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink)}
.meta #tag{width:140px}
.duel{display:flex;align-items:center;gap:6px;font-weight:700}
.duel input{width:auto;padding:4px 10px}
.lnk{font-size:12.5px;font-weight:700;color:var(--accent);padding:4px}
.mark{flex:none;display:flex;align-items:center;gap:9px;padding:2px 0 10px}
.dot.none{background:var(--sunk);color:var(--mute);display:grid;place-items:center;font-size:13px;line-height:1;--lc:var(--mute)}
.mname{font-size:12.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{flex:none;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;touch-action:pan-x}
.tools::-webkit-scrollbar{display:none}
.tb{flex:none;min-width:36px;height:34px;padding:0 11px;border-radius:10px;font-weight:800;font-size:13px;color:var(--mute);background:var(--sunk)}
.tb:hover,.tb:active{color:var(--ink)}
.content{flex:1;min-height:0;position:relative;border-top:1px solid var(--line)}
#body{height:100%;resize:none;font-size:16px;line-height:1.7;display:block;overflow-y:auto;overscroll-behavior:contain;padding:12px 0 28px;touch-action:pan-y}
#body::placeholder{color:var(--mute);opacity:.7}
.view{height:100%;overflow-y:auto;overscroll-behavior:contain;padding:10px 0 28px;font-size:16px;line-height:1.7;cursor:text;touch-action:pan-y}
.view h1{font:600 22px/1.3 var(--display);margin:14px 0 4px}
.view h2{font:600 18px/1.3 var(--display);margin:14px 0 4px}
.view p{margin:0 0 4px;min-height:1.2em}
.view .q{border-left:3px solid var(--accent);padding-left:12px;color:var(--mute);margin:4px 0}
.view .li{display:flex;gap:10px;padding-left:4px}
.view .li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:.72em;flex:none}
.view code{background:var(--sunk);border-radius:6px;padding:1px 6px;font-size:.9em}
.ck{display:flex;gap:12px;align-items:flex-start;padding:4px 0;cursor:pointer;-webkit-user-select:none;user-select:none}
.box{flex:none;width:23px;height:23px;border-radius:7px;border:1.8px solid var(--mute);margin-top:3px;display:grid;place-items:center;color:var(--accent-ink);transition:background .12s,border-color .12s}
.ck.on .box{background:var(--accent);border-color:var(--accent)}
.ck.on span{color:var(--mute);text-decoration:line-through}
.ghost{color:var(--mute)}
.sbar{flex:none;display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--mute);font-weight:600;padding:8px 0 calc(10px + var(--sab));border-top:1px solid var(--line)}
.pop{position:absolute;right:14px;top:calc(56px + var(--sat));z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;min-width:210px;box-shadow:0 18px 44px -14px rgba(10,20,50,.4)}
.pop button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;font-size:14.5px;font-weight:700}
.pop button:hover,.pop button:active{background:var(--sunk)}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 10px 10px 18px;border-radius:99px;font-size:14px;font-weight:700;z-index:30;display:flex;gap:12px;align-items:center;max-width:92%;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast button{color:var(--accent);font-weight:800;padding:0 8px}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.5);z-index:20;display:grid;place-items:center;padding:16px}
.sheet{background:var(--panel);border-radius:22px;padding:20px;width:100%;max-width:520px;max-height:88%;overflow-y:auto;overscroll-behavior:contain}
.sheet h3{margin:0 0 4px;font:600 18px var(--display)}
.sheet p{margin:0 0 12px;color:var(--mute);font-size:13.5px}
.sheet textarea{height:44vh;background:var(--sunk);border-radius:12px;padding:12px;font-size:13px;margin:10px 0;font-family:ui-monospace,Menlo,monospace}
.tpl{display:flex;flex-direction:column;gap:6px}
.tpl button{display:flex;gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:14px;background:var(--sunk)}
.tpl button i{width:10px;height:10px;border-radius:50%;background:var(--lc,var(--mute));flex:none}
.tpl button b{display:block;font-size:15px}
.tpl button span{font-size:12.5px;color:var(--mute)}
.tpl button:hover,.tpl button:active{background:var(--accent-soft)}
.lrow{display:flex;align-items:center;gap:12px;padding:6px 0}
.lrow input{background:var(--sunk);border-radius:11px;padding:9px 12px;font-size:16px}
.sheet .primary{margin-top:14px;width:100%}
.set{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;padding:14px 0;border-top:1px solid var(--line)}
.set>div:first-child{flex:1 1 180px}
.set:first-of-type{border-top:0}
.set b{font-size:14.5px}
.set small{display:block;color:var(--mute);font-size:12.5px;font-weight:500}
.seg{display:flex;background:var(--sunk);border-radius:11px;padding:3px}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sbtn{padding:8px 14px;border-radius:11px;background:var(--sunk);font-weight:700;font-size:13.5px;white-space:nowrap}
.ver{text-align:center;color:var(--mute);font-size:12px;margin-top:10px}

/* ---- phone ---- */
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side,.main{grid-column:1;grid-row:1}
  .side{border-right:0}
  .main{background:var(--panel)}
  .app[data-screen="list"] .main{display:none}
  .app[data-screen="edit"] .side{display:none}
  .back{display:flex}
  .btn-new{display:none}
  .fab{display:flex}
  .list{padding-bottom:calc(100px + var(--sab))}
  .bar{padding:calc(8px + var(--sat)) 8px 0 6px}
  .page{padding:0 18px}
  #title{font-size:25px}
  .search input{font-size:16px}
  .app[data-screen="list"] ~ .toast{bottom:calc(92px + var(--sab))}
}
@media (max-width:420px){
  .mark .cap,.mark .lnk{display:none}
  .meta #tag{width:132px}
}
@media (max-height:540px){.meta,.mark{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app" data-screen="list">
  <aside class="side">
    <div class="brand">
      <div class="logo">IBG</div>
      <div class="who"><b>IBG Studios</b><span>Notes</span></div>
      <button class="ib" data-act="settings" aria-label="Settings" title="Settings" id="setbtn"></button>
    </div>
    <div class="tools-top">
      <label class="search" for="q"><svg id="ic-search" width="18" height="18"></svg><input id="q" type="search" placeholder="Search notes" autocomplete="off" enterkeyhint="search"></label>
      <button class="btn-new" id="new" aria-label="New note" title="New note"></button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="cbar" id="cbar"></div>
    <div class="listhead"><span id="count"></span>
      <select id="sort" aria-label="Sort notes">
        <option value="recent">Recently edited</option>
        <option value="created">Newest first</option>
        <option value="title">Title A–Z</option>
        <option value="color">Importance</option>
        <option value="due">Due date</option>
      </select>
    </div>
    <div class="list" id="list"><div class="hint">Loading your notes…</div></div>
    <button class="fab" id="fab" aria-label="New note"></button>
  </aside>
  <main class="main" id="main">
    <div class="empty" id="empty">
      <div class="logo">IBG</div>
      <h2>Pick a note or start a new one</h2>
      <p>Plans, ideas and to-dos for every game, in one quiet place.</p>
      <button class="primary" id="new2">+ New note</button>
    </div>
    <div class="ed" id="ed" hidden>
      <div class="bar" id="bar"></div>
      <div class="page">
        <input id="title" placeholder="Title" autocomplete="off" enterkeyhint="next">
        <div class="meta">
          <input id="tag" list="taglist" placeholder="Add tag" autocomplete="off"><datalist id="taglist"></datalist>
          <label class="duel" for="due">Due <input id="due" type="date"></label><button class="lnk" id="cleardue" data-act="cleardue" aria-label="Clear due date" title="Clear due date" hidden>✕</button>
        </div>
        <div class="mark" id="mark"></div>
        <div class="tools" id="tools">
          <button class="tb" data-ins="ck" title="Checklist">☐ List</button>
          <button class="tb" data-ins="li" title="Bullet">• Bullet</button>
          <button class="tb" data-ins="h" title="Heading">H</button>
          <button class="tb" data-ins="b" title="Bold">B</button>
          <button class="tb" data-ins="q" title="Quote">“</button>
          <button class="tb" data-ins="d" title="Insert today's date">Date</button>
        </div>
        <div class="content">
          <textarea id="body" placeholder="Start writing. Tap ☐ List for a checklist."></textarea>
          <div class="view" id="view" hidden></div>
        </div>
        <div class="sbar"><span id="info"></span><span id="status"></span></div>
      </div>
      <div class="pop" id="pop" hidden></div>
    </div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<div id="modalhost"></div>
<input type="file" id="rf" accept=".json,application/json" hidden>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var clone=function(o){return JSON.parse(JSON.stringify(o));};
var IC={
 plus:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 pin:'<path d="M9 4h6l-1 6 3 3v2H7v-2l3-3-1-6z"/><path d="M12 15v5"/>',
 eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
 more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 back:'<path d="m15 18-6-6 6-6"/>',
 restore:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',

/* ---------- storage ---------- */
function localStore(){
  var K='ibg-notes-v1',LK='ibg-labels-v1',data={};
  try{data=JSON.parse(localStorage.getItem(K)||'{}');}catch(e){data={};}
  var write=function(){try{localStorage.setItem(K,JSON.stringify(data));}catch(e){toast('Phone storage is full. Back up and delete old notes.');}};
  return {
    start:function(f){f(clone(data));},
    save:function(n){data[n.id]=clone(n);write();return Promise.resolve();},
    del:function(id){delete data[id];write();return Promise.resolve();},
    labels:function(cb){var v=null;try{v=JSON.parse(localStorage.getItem(LK)||'null');}catch(e){}if(v)cb(v);},
    saveLabels:function(o){try{localStorage.setItem(LK,JSON.stringify(o));}catch(e){}return Promise.resolve();}
  };
}
function dbStore(db){
  return {
    start:function(f){
      db.collection('notes').onSnapshot(function(s){var o={};s.docs.forEach(function(d){var v=clone(d.data()||{});v.id=d.id;o[d.id]=v;});f(o);},function(){setStatus('Offline');if(!loaded){loaded=true;renderList();}});
    },
    save:function(n){var b=clone(n);delete b.id;return db.doc('notes/'+n.id).set(b);},
    del:function(id){return db.doc('notes/'+id).delete();},
    labels:function(cb){db.doc('meta/labels').onSnapshot(function(s){if(s.exists)cb(s.data());},function(){});},
    saveLabels:function(o){return db.doc('meta/labels').set(o);}
  };

function setStatus(s){var el=$('#status');if(el)el.textContent=s;}
function norm(n){n.title=n.title||'';n.body=n.body||'';n.tag=n.tag||'';n.color=KEYS.indexOf(n.color)>-1?n.color:'';n.due=n.due||'';n.pinned=!!n.pinned;n.trashed=!!n.trashed;n.created=n.created||n.updated||new Date().toISOString();n.updated=n.updated||n.created;return n;}
function uid(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function hue(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%60;return 200+h;}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return dstr(new Date());}
function weekStr(){var d=new Date();d.setDate(d.getDate()+7);return dstr(d);}
function fmtShort(iso){
  var d=new Date(iso),now=new Date();
  if(d.toDateString()===now.toDateString())return d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
  var y=new Date(now);y.setDate(now.getDate()-1);
  if(d.toDateString()===y.toDateString())return 'Yesterday';
  return d.toLocaleDateString('en-IN',d.getFullYear()===now.getFullYear()?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'2-digit'});
}
function fmtFull(iso){return new Date(iso).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});}
function fmtDue(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]).toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
function words(s){s=s.trim();return s?s.split(/\s+/).length:0;}

/* ---------- list, filters, colours ---------- */
function live(){return Object.keys(N).map(function(k){return N[k];}).filter(function(n){return !n.trashed;});}
function renderFilters(){
  var all=live(),tags={};

  var trashed=Object.keys(N).filter(function(k){return N[k].trashed;}).length;
  var pinned=all.filter(function(n){return n.pinned;}).length;
  var soon=all.filter(dueSoon).length;
  var chips=[['all','All',all.length,'']];
  if(soon)chips.push(['due','Due soon',soon,' warn']);
  if(pinned)chips.push(['pinned','Pinned',pinned,'']);
  Object.keys(tags).sort().forEach(function(t){chips.push(['t:'+t,t,tags[t],'']);});
  if(trashed)chips.push(['trash','Deleted',trashed,'']);
  if(!chips.some(function(c){return c[0]===filter;}))filter='all';
  $('#filters').innerHTML=chips.map(function(c){return '<button class="chip'+c[3]+(filter===c[0]?' on':'')+'" data-f="'+esc(c[0])+'">'+esc(c[1])+'<em>'+c[2]+'</em></button>';}).join('');
  var seen={},opts=[];
  DEFAULT_TAGS.concat(Object.keys(tags)).forEach(function(t){if(!seen[t]){seen[t]=1;opts.push('<option value="'+esc(t)+'">');}});

}
function renderCbar(all){

  $('#cbar').innerHTML='<span class="cap">Mark</span>'+KEYS.map(function(k){
    return '<button class="cdot'+(cfilter===k?' on':'')+(cfilter&&cfilter!==k?' off':'')+'" style="--lc:var(--c-'+k+')" data-cf="'+k+'" title="'+esc(labels[k])+' ('+(cnt[k]||0)+')" aria-label="Show '+esc(labels[k])+' notes"></button>';
  }).join('');
}
var ORDER='roygbvk';
function cmp(a,b){
  if(a.pinned!==b.pinned)return a.pinned?-1:1;
  if(sortBy==='created'){if(a.created!==b.created)return a.created<b.created?1:-1;}
  else if(sortBy==='title'){var t=(a.title||'~').localeCompare(b.title||'~');if(t)return t;}
  else if(sortBy==='color'){var ca=a.color?ORDER.indexOf(a.color):9,cb=b.color?ORDER.indexOf(b.color):9;if(ca!==cb)return ca-cb;}
  else if(sortBy==='due'){var da=a.due||'9999',dd=b.due||'9999';if(da!==dd)return da<dd?-1:1;}
  return a.updated<b.updated?1:a.updated>b.updated?-1:0;
}
function visibleNotes(){
  var arr=Object.keys(N).map(function(k){return N[k];});
  arr=arr.filter(function(n){return filter==='trash'?n.trashed:!n.trashed;});
  if(filter==='pinned')arr=arr.filter(function(n){return n.pinned;});
  if(filter==='due')arr=arr.filter(dueSoon);
  if(filter.indexOf('t:')===0)arr=arr.filter(function(n){return n.tag===filter.slice(2);});
  if(cfilter)arr=arr.filter(function(n){return n.color===cfilter;});
  if(q){var s=q.toLowerCase();arr=arr.filter(function(n){return (n.title+' '+n.body+' '+n.tag+' '+(n.color?labels[n.color]:'')).toLowerCase().indexOf(s)>-1;});}
  if(filter==='due'){arr.sort(function(a,b){return a.due<b.due?-1:a.due>b.due?1:cmp(a,b);});}else arr.sort(cmp);
  return arr;
}
function renderList(){
  if(!loaded)return;
  var arr=visibleNotes(),el=$('#list');
  $('#count').textContent=arr.length+(arr.length===1?' note':' notes');
  if(!arr.length){el.innerHTML='<div class="hint">'+(q?'No notes match “'+esc(q)+'”.':cfilter?'No notes marked '+esc(labels[cfilter])+'.':filter==='trash'?'Nothing deleted.':Object.keys(N).length?'Nothing here.':'No notes yet.<br>Tap <b>New note</b> to write your first one.')+'</div>';return;}
  var td=todayStr();
  el.innerHTML=arr.map(function(n){
    var pr=progress(n.body),dueCls=n.due?(n.due<td?' over':n.due===td?' today':''):'';
    var dueTxt=n.due?(n.due===td?'Due today':(n.due<td?'Overdue · ':'Due ')+fmtDue(n.due)):'';
    return '<div class="item'+(n.id===sel?' on':'')+'" role="button" tabindex="0" data-id="'+n.id+'"'+(n.color?' data-c="'+n.color+'" style="--lc:var(--c-'+n.color+')"':'')+'><h3>'+(n.pinned?ic('pin',14,true):'')+'<span>'+esc(n.title.trim()||'Untitled')+'</span></h3><p>'+esc(snippet(n.body))+'</p><div class="row">'+(n.tag?'<span class="tag" style="--h:'+hue(n.tag)+'">'+esc(n.tag)+'</span>':'')+(pr.t?'<span class="prog"><span class="mini"><i style="width:'+Math.round(pr.d*100/pr.t)+'%"></i></span>'+pr.d+'/'+pr.t+'</span>':'')+(n.due?'<span class="due'+dueCls+'">'+esc(dueTxt)+'</span>':'')+'<span class="sp"></span><span>'+esc(fmtShort(n.updated))+'</span></div></div>';
  }).join('');

       '<button class="ib danger" data-act="trash" aria-label="Delete" title="Delete">'+ic('trash',19)+'</button>';

function renderMark(){

}
function updateInfo(){var n=current();if(!n)return;$('#info').textContent='Edited '+fmtFull(n.updated)+' · '+words(n.body)+' words';}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
function renderView(b){
  if(!b.trim())return '<p class="ghost">Empty note. Tap to write.</p>';
  return b.split('\n').map(function(ln,i){
    var m;
    if((m=ln.match(/^\s*- \[( |x|X)\] ?(.*)$/)))return '<div class="ck'+(m[1]!==' '?' on':'')+'" data-line="'+i+'" role="checkbox" aria-checked="'+(m[1]!==' ')+'"><span class="box">'+(m[1]!==' '?ic('check',14,false,2.6):'')+'</span><span>'+(inline(m[2])||'&nbsp;')+'</span></div>';

    if((m=ln.match(/^- (.*)/)))return '<div class="li"><span>'+inline(m[1])+'</span></div>';
    if((m=ln.match(/^> (.*)/)))return '<div class="q">'+inline(m[1])+'</div>';
    return '<p>'+inline(ln)+'</p>';
  }).join('');

function applyMode(){

function discardIfEmpty(id){

function createNote(key){
  if(!store)return;
  var t=TPL[key||'blank'],now=new Date().toISOString();
  var n={id:uid(),title:typeof t.title==='function'?t.title():t.title,body:t.body,tag:filter.indexOf('t:')===0?filter.slice(2):'',color:t.color||cfilter||'',due:'',pinned:false,trashed:false,created:now,updated:now};

/* ---------- saving ---------- */
function touch(n){
  n.updated=new Date().toISOString();dirty[n.id]=1;ver[n.id]=(ver[n.id]||0)+1;
  setStatus('Saving…');updateInfo();
  clearTimeout(timers[n.id]);timers[n.id]=setTimeout(function(){flush(n.id);},600);
  renderList();renderCbar();
}
function flush(id){
  var n=N[id];if(!n||!store)return;
  if(saving[id]){timers[id]=setTimeout(function(){flush(id);},300);return;}
  saving[id]=1;var v=ver[id];
  store.save(n).then(function(){saving[id]=0;if(ver[id]===v){delete dirty[id];if(sel===id)setStatus(localOnly?'Saved on this device':'Saved');}},function(){saving[id]=0;setStatus('Not saved');toast('Could not save. Check your connection.');});
}
function onData(o){
  loaded=true;
  Object.keys(N).forEach(function(id){if(!(id in o)&&!dirty[id])delete N[id];});
  Object.keys(o).forEach(function(id){
    if(dirty[id])return;
    var ch=!N[id]||N[id].updated!==o[id].updated;
    N[id]=norm(o[id]);
    if(id===sel&&ch){var a=document.activeElement;if(!(a&&(a.id==='title'||a.id==='body'||a.id==='tag')))loadEditor();}
  });
  if(sel&&!N[sel]){sel=null;loadEditor();if($('#app').dataset.screen==='edit')goList();}
  renderFilters();renderList();
}
function applyLabels(o){
  if(labelsOpen)return;

  renderCbar();renderMark();renderList();

/* ---------- toolbar + sheets ---------- */
function mutate(fn){var t=$('#body');t.focus();fn(t);t.dispatchEvent(new Event('input'));}
function linePrefix(prefix){mutate(function(t){
  var v=t.value,s=t.selectionStart,ls=v.lastIndexOf('\n',s-1)+1,le=v.indexOf('\n',s);if(le<0)le=v.length;
  var line=v.slice(ls,le),nl=line.indexOf(prefix)===0?line.slice(prefix.length):prefix+line.replace(/^(#{1,3} |- \[[ xX]\] |- |> )/,'');
  t.value=v.slice(0,ls)+nl+v.slice(le);var p=ls+nl.length;t.setSelectionRange(p,p);
});}
function wrap(mk){mutate(function(t){var s=t.selectionStart,e=t.selectionEnd,v=t.value;t.value=v.slice(0,s)+mk+v.slice(s,e)+mk+v.slice(e);t.setSelectionRange(s+mk.length,e+mk.length);});}
function insertText(x){mutate(function(t){var s=t.selectionStart;if(s>0&&!/\s/.test(t.value.charAt(s-1)))x=' '+x;t.value=t.value.slice(0,s)+x+t.value.slice(t.selectionEnd);t.setSelectionRange(s+x.length,s+x.length);});}
function openModal(html){$('#modalhost').innerHTML='<div class="modal" data-act="closemodal"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';}

function copyText(txt){

    setTimeout(function(){var t=$('#mtxt');if(t){t.focus();t.select();}},30);

}
function showTemplates(){
  openModal('<h3>New note</h3><p>Start blank or pick a ready-made layout.</p><div class="tpl">'+Object.keys(TPL).map(function(k){var c=TPL[k].color;return '<button data-tpl="'+k+'"><i'+(c?' style="--lc:var(--c-'+c+')"':'')+'></i><div><b>'+esc(TPL[k].name)+'</b><span>'+esc(TPL[k].desc)+'</span></div></button>';}).join('')+'</div>');
}
function showLabels(){
  labelsOpen=true;
  openModal('<h3>What each colour means</h3><p>Rename them to suit your work. For example, red can mean Urgent or Bug.</p>'+KEYS.map(function(k){return '<div class="lrow"><span class="dot" style="--lc:var(--c-'+k+')"></span><input data-lk="'+k+'" maxlength="18" value="'+esc(labels[k])+'" aria-label="Name for colour"></div>';}).join('')+'<button class="primary" data-act="closemodal">Done</button>');
}
function showSettings(){
  var seg=['auto','light','dark'].map(function(t){return '<button class="'+(theme===t?'on':'')+'" data-theme-opt="'+t+'">'+t.charAt(0).toUpperCase()+t.slice(1)+'</button>';}).join('');
  var total=live().length;
  openModal('<h3>Settings</h3>'+
    '<div class="set"><div><b>Theme</b><small>Auto follows your phone</small></div><div class="seg">'+seg+'</div></div>'+
    '<div class="set"><div><b>Colour meanings</b><small>'+esc(KEYS.map(function(k){return labels[k];}).slice(0,3).join(', '))+'…</small></div><button class="sbtn" data-act="labels">Edit</button></div>'+
    (localOnly?
      '<div class="set"><div><b>Backup</b><small>Notes are saved on this phone only. Back up now and then.</small></div><div style="display:flex;gap:6px"><button class="sbtn" data-act="backup">Back up</button><button class="sbtn" data-act="restoref">Restore</button></div></div>':
      '<div class="set"><div><b>Sync</b><small>Notes are saved to your claude.ai account.</small></div></div>')+
    '<div class="set"><div><b>Copy all notes</b><small>'+total+(total===1?' note':' notes')+' as plain text</small></div><button class="sbtn" data-act="copyall">Copy</button></div>'+
    '<p class="ver">IBG Studios Notes · v3</p><button class="primary" data-act="closemodal">Done</button>');
}
function renderPop(){
  var n=current(),p=$('#pop');if(!n)return;
  p.innerHTML='<button data-act="copy">Copy note text</button><button data-act="dup">Duplicate note</button>'+(hasDone(n.body)?'<button data-act="cleardone">Clear completed items</button>':'')+'<button data-act="labels">Rename colours</button>';
}
function backup(){
  var list=Object.keys(N).map(function(k){return N[k];});
  if(!list.length){toast('Nothing to back up yet');return;}
  var data=JSON.stringify({app:'ibg-notes',version:3,exported:new Date().toISOString(),labels:labels,notes:list},null,1);
  try{
    var url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    var a=document.createElement('a');a.href=url;a.download='ibg-notes-backup-'+todayStr()+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},4000);
    toast('Backup saved to your Downloads');
  }catch(e){copyText(data);}
}
function allText(){
  return live().sort(cmp).map(function(n){return '# '+(n.title||'Untitled')+(n.tag?' ['+n.tag+']':'')+(n.color?' ('+labels[n.color]+')':'')+(n.due?' — due '+n.due:'')+'\n'+n.body;}).join('\n\n---\n\n');
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  var pop=$('#pop');
  if(pop&&!pop.hidden&&!t.closest('#pop')&&!t.closest('[data-act="more"]'))pop.hidden=true;
  var a=t.closest('[data-act]');
  if(a&&a.classList.contains('modal')&&t!==a)a=null;
  if(a){
    var act=a.dataset.act,n=current();
    if(act==='closemodal'){closeModal();return;}
    if(act==='undo'){var f=undoFn;undoFn=null;$('#toast').hidden=true;if(f)f();return;}
    if(act==='settings'){showSettings();return;}
    if(act==='backup'){backup();return;}
    if(act==='restoref'){$('#rf').click();return;}
    if(act==='copyall'){closeModal();copyText(allText());return;}
    if(act==='labels'){pop.hidden=true;showLabels();return;}
    if(act==='back'){goList(false);return;}
    if(!n)return;
    if(act==='pin'){n.pinned=!n.pinned;buzz();touch(n);renderBar();renderFilters();}
    else if(act==='mode'){mode=mode==='view'?'edit':'view';applyMode();if(mode==='edit')setTimeout(function(){$('#body').focus();},20);}
    else if(act==='more'){renderPop();pop.hidden=!pop.hidden;}
    else if(act==='copy'){pop.hidden=true;copyText((n.title?n.title+'\n\n':'')+n.body);}
    else if(act==='dup'){
      pop.hidden=true;var now=new Date().toISOString(),c=clone(n);c.id=uid();c.title=(n.title||'Untitled')+' (copy)';c.created=now;c.updated=now;c.pinned=false;
      N[c.id]=c;select(c.id,'view');touch(c);toast('Duplicated');
    }
    else if(act==='cleardone'){
      pop.hidden=true;var old=n.body;
      n.body=n.body.split('\n').filter(function(l){return !/^\s*- \[[xX]\]/.test(l);}).join('\n');
      $('#body').value=n.body;touch(n);applyMode();
      toast('Cleared completed items',function(){n.body=old;$('#body').value=old;touch(n);applyMode();});
    }
    else if(act==='cleardue'){n.due='';$('#due').value='';a.hidden=true;touch(n);renderFilters();}
    else if(act==='trash'){
      var wasPinned=n.pinned;n.trashed=true;n.pinned=false;touch(n);sel=null;goList(false);
      toast('Moved to Deleted',function(){n.trashed=false;n.pinned=wasPinned;touch(n);renderFilters();renderList();});
    }
    else if(act==='restore'){n.trashed=false;touch(n);toast('Restored');filter='all';loadEditor();renderFilters();renderList();}
    else if(act==='purge'){
      if(arm===n.id){var id=n.id;delete N[id];delete dirty[id];clearTimeout(timers[id]);if(store)store.del(id);sel=null;arm=null;goList(false);toast('Deleted for good');}
      else{arm=n.id;renderBar();}
    }
    return;
  }
  var th=t.closest('[data-theme-opt]');
  if(th){theme=th.dataset.themeOpt;try{localStorage.setItem('ibg-theme',theme);}catch(x){}applyTheme();th.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b===th);});return;}
  var tp=t.closest('[data-tpl]');
  if(tp){closeModal();createNote(tp.dataset.tpl);return;}
  var cf=t.closest('[data-cf]');
  if(cf){cfilter=cfilter===cf.dataset.cf?'':cf.dataset.cf;buzz();renderCbar();renderList();return;}
  var col=t.closest('[data-col]');
  if(col){var cn=current();if(cn&&!cn.trashed){cn.color=col.dataset.col;buzz();touch(cn);renderMark();}return;}
  var f2=t.closest('[data-f]');
  if(f2){filter=f2.dataset.f;renderFilters();renderList();$('#list').scrollTop=0;return;}
  var it=t.closest('.item');
  if(it){select(it.dataset.id);return;}
  var ins=t.closest('[data-ins]');
  if(ins){
    var k=ins.dataset.ins;
    if(k==='h')linePrefix('## ');else if(k==='li')linePrefix('- ');else if(k==='ck')linePrefix('- [ ] ');else if(k==='q')linePrefix('> ');
    else if(k==='b')wrap('**');else if(k==='d')insertText(new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'}));
    return;
  }
  var ck=t.closest('.ck');
  if(ck&&ck.dataset.line!==undefined){
    var nn=current();if(!nn||nn.trashed)return;
    var ls=nn.body.split('\n'),i=+ck.dataset.line;
    ls[i]=/\[ \]/.test(ls[i])?ls[i].replace('[ ]','[x]'):ls[i].replace(/\[[xX]\]/,'[ ]');
    nn.body=ls.join('\n');$('#body').value=nn.body;buzz();touch(nn);
    var v0=$('#view'),st=v0.scrollTop;v0.innerHTML=renderView(nn.body);v0.scrollTop=st;return;
  }
  var v=t.closest('#view');
  if(v&&current()&&!current().trashed){mode='edit';applyMode();setTimeout(function(){$('#body').focus();},20);}
});
/* keep the toolbar from stealing focus from the text on phones */
document.addEventListener('mousedown',function(e){if(e.target.closest('[data-ins]'))e.preventDefault();});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].indexOf(e.key)>-1){e.preventDefault();return;}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('item')){select(e.target.dataset.id);}
  if(e.key==='Enter'&&e.target.id==='title'){e.preventDefault();var b=$('#body');if(mode!=='edit'){mode='edit';applyMode();}b.focus();}
  if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){e.preventDefault();$('#q').focus();}
  if(e.key==='Escape'){
    if($('#modalhost').firstChild){closeModal();return;}
    if(e.target.id==='q'){e.target.value='';q='';renderList();e.target.blur();}
  }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.lk){
    labels[el.dataset.lk]=el.value.trim()||DEF[el.dataset.lk];
    clearTimeout(lblTimer);lblTimer=setTimeout(function(){if(store)store.saveLabels(clone(labels));},500);
  }
});
$('#new').addEventListener('click',showTemplates);
$('#fab').addEventListener('click',showTemplates);
$('#new2').addEventListener('click',showTemplates);
$('#q').addEventListener('input',function(e){q=e.target.value.trim();renderList();});
$('#sort').addEventListener('change',function(e){sortBy=e.target.value;try{localStorage.setItem('ibg-sort',sortBy);}catch(x){}renderList();});
$('#sort').value=sortBy;
$('#title').addEventListener('input',function(e){var n=current();if(!n||n.trashed)return;n.title=e.target.value;touch(n);});
$('#tag').addEventListener('input',function(e){var n=current();if(!n||n.trashed)return;n.tag=e.target.value.trim();touch(n);});
$('#tag').addEventListener('change',function(){renderFilters();});
$('#due').addEventListener('change',function(e){var n=current();if(!n||n.trashed)return;n.due=e.target.value;$('#cleardue').hidden=!n.due;touch(n);renderFilters();});
$('#body').addEventListener('input',function(e){var n=current();if(!n||n.trashed)return;n.body=e.target.value;touch(n);});
$('#body').addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
  var t=e.target,s=t.selectionStart;if(s!==t.selectionEnd)return;
  var v=t.value,ls=v.lastIndexOf('\n',s-1)+1,m=v.slice(ls,s).match(/^(- \[[ xX]\] |- |> )(.*)$/);
  if(!m)return;
  e.preventDefault();
  if(!m[2].trim()){t.value=v.slice(0,ls)+v.slice(s);t.setSelectionRange(ls,ls);}
  else{var pre=m[1].indexOf('- [')===0?'- [ ] ':m[1],ins='\n'+pre;t.value=v.slice(0,s)+ins+v.slice(s);var p=s+ins.length;t.setSelectionRange(p,p);}
  t.dispatchEvent(new Event('input'));
});
$('#rf').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result),arr=Array.isArray(j)?j:j.notes;
      if(!Array.isArray(arr))throw new Error('bad');
      var added=0;
      arr.forEach(function(x){
        if(!x||!x.id)return;
        x=norm(x);
        if(!N[x.id]||N[x.id].updated<x.updated){N[x.id]=x;added++;store.save(x);}
      });
      if(j&&j.labels){var wasOpen=labelsOpen;labelsOpen=false;applyLabels(j.labels);labelsOpen=wasOpen;store.saveLabels(clone(labels));}
      closeModal();renderFilters();renderList();toast(added?('Restored '+added+' note'+(added>1?'s':'')):'Everything was already here');
    }catch(err){toast('That file is not an IBG Notes backup');}
    e.target.value='';
  };
  r.readAsText(f);
});
window.addEventListener('pagehide',function(){Object.keys(dirty).forEach(function(id){clearTimeout(timers[id]);flush(id);});});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')Object.keys(dirty).forEach(function(id){clearTimeout(timers[id]);flush(id);});});
window.addEventListener('resize',function(){if(!isPhone()&&$('#app').dataset.screen==='edit'&&!sel)$('#app').dataset.screen='list';});

/* ---------- start ---------- */
function begin(s){store=s;s.labels(applyLabels);s.start(onData);}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
var cl=window.claude;
if(cl&&cl.use){
  cl.use('db').then(function(d){
    if(d){begin(dbStore(d));}
    else{localOnly=true;begin(localStore());}
  },function(){localOnly=true;begin(localStore());});
}else{localOnly=true;begin(localStore());}
})();
</script>
